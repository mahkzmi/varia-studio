name: Varia Studio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
